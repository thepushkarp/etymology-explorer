# Dependency update automation.
#
# The bun ecosystem (not npm) is used so Dependabot updates bun.lock together
# with package.json — npm-ecosystem updates rewrite only package.json, which
# desyncs the lockfile and breaks `bun install --frozen-lockfile` in CI
# (this is what happened with the next 16.2.6 bump in PR #63).
version: 2
updates:
  - package-ecosystem: 'bun'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      dependencies:
        patterns:
          - '*'
    ignore:
      # Held back until the toolchain catches up (see PR #70): eslint-config-next
      # lacks ESLint 10 support and @types/bun lacks TypeScript 6 support.
      - dependency-name: 'eslint'
        update-types: ['version-update:semver-major']
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - '*'
