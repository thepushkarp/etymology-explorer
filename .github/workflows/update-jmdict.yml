name: Refresh JMdict index

on:
  schedule:
    - cron: '17 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - run: bun install --frozen-lockfile
      - run: bun run data:update:japanese
      - run: bun test lib/japanese
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/refresh-jmdict
          delete-branch: true
          commit-message: 'chore: refresh JMdict index'
          title: 'chore: refresh JMdict index'
          body: |
            Automated monthly refresh of the compact JMdict runtime index.

            - Source and dictionary dates are recorded in `data/jmdict/manifest.json`.
            - Resolver fixtures ran before this pull request was opened.
